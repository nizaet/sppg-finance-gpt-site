openapi: 3.1.0
info:
  title: SPPG Hermes Lab
  version: 0.5.0
  description: Experimental bridge from a Custom GPT to Hermes Agent with authenticated read-only operational access, shared memory, and approval-required staging proposals. This gateway cannot approve or execute operations.
servers:
  - url: https://REPLACE_WITH_HERMES_LAB_HOST
paths:
  /health:
    get:
      operationId: hermesLabHealth
      summary: Check Hermes Lab and shared-memory status
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/lab/chat:
    post:
      operationId: askHermesLab
      summary: Ask Hermes using shared SPPG behavior memory
      description: Hermes automatically loads recent confirmed knowledge and conversation behavior learned by the legacy GPTS, then stores the Hermes turn back into the same memory layer. Operational production data remains read-only.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    required: [role, content]
                    properties:
                      role:
                        type: string
                        enum: [user, assistant]
                      content:
                        type: string
                conversation_ref:
                  type: [string, 'null']
                  maxLength: 200
                turn_ref:
                  type: [string, 'null']
                  maxLength: 200
      responses:
        '200':
          description: Hermes Lab answer and memory status
          content:
            application/json:
              schema:
                type: object
                required: [answer, mode, model, memory_loaded, memory_stored]
                properties:
                  answer:
                    type: string
                  mode:
                    type: string
                  model:
                    type: string
                  memory_loaded:
                    type: boolean
                  memory_stored:
                    type: boolean
  /v1/lab/purchase-orders:
    get:
      operationId: searchHermesSppgPurchaseOrders
      summary: Search live SPPG purchase orders without changing data
      description: READ-ONLY. Use whenever the user asks about live or historical PO records. Supply site, vendor, and distribution date or date range when known. The result comes from SPPG Core PostgreSQL and this action cannot create, update, delete, finalize, or send a PO.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: site
          schema:
            type: string
            enum: [MAJA, CEMPLANG]
        - in: query
          name: vendor
          schema:
            type: string
            maxLength: 100
        - in: query
          name: distributionDate
          description: Exact distribution date. Do not combine with dateFrom/dateTo unless intentionally narrowing the same date.
          schema:
            type: string
            format: date
        - in: query
          name: dateFrom
          description: Inclusive start of the distribution-date range.
          schema:
            type: string
            format: date
        - in: query
          name: dateTo
          description: Inclusive end of the distribution-date range.
          schema:
            type: string
            format: date
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: Matching PO headers and line items from SPPG Core PostgreSQL
          content:
            application/json:
              schema:
                type: object
                required: [items, count, readOnly, sourceOfTruth]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  count:
                    type: integer
                  readOnly:
                    type: boolean
                  sourceOfTruth:
                    type: string
  /v1/lab/proposals:
    post:
      operationId: createHermesActionProposal
      summary: Stage a Hermes action proposal for operator review
      description: Creates only PENDING/PLANNED staging records. It cannot approve or execute PO, receiving, payment, finance, stock, or message actions. CREATE_PO requires a complete canonical DRAFT payload; quantities, prices, dates, identifiers, site, and vendor must never be guessed.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_ref, action_type, site, target_type, rationale]
              properties:
                source_ref:
                  type: string
                  maxLength: 300
                action_type:
                  type: string
                  enum: [CREATE_PO, RECORD_RECEIVING, RECORD_VENDOR_PAYABLE, RECORD_VENDOR_PAYMENT, RECORD_FINANCE_TRANSACTION, SEND_WHATSAPP]
                site:
                  type: string
                  enum: [MAJA, CEMPLANG]
                vendor_code:
                  type: [string, 'null']
                entity_code:
                  type: [string, 'null']
                target_type:
                  type: string
                target_id:
                  type: [string, 'null']
                rationale:
                  type: string
                confidence:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.5
                payload:
                  type: object
                  description: For CREATE_PO use the canonical fields below. Other action types remain staging-only and are not executable.
                  properties:
                    po_code:
                      type: string
                      description: Must start with PO-{SITE}-{distribution date as YYYYMMDD}.
                    distribution_date:
                      type: string
                      format: date
                    cooking_at:
                      type: [string, 'null']
                      format: date-time
                    source_planning_snapshot_id:
                      type: [integer, 'null']
                    status:
                      type: string
                      enum: [DRAFT]
                    items:
                      type: array
                      minItems: 1
                      items:
                        type: object
                        required: [item_name, po_qty]
                        additionalProperties: false
                        properties:
                          item_code: {type: [string, 'null']}
                          item_name: {type: string}
                          planning_snapshot_item_id: {type: [integer, 'null']}
                          planned_qty: {type: [number, 'null'], minimum: 0}
                          po_qty: {type: number, exclusiveMinimum: 0}
                          unit: {type: [string, 'null']}
                          planning_price: {type: [number, 'null'], minimum: 0}
                          po_price: {type: [number, 'null'], minimum: 0}
                          aliases:
                            type: array
                            items: {type: string}
                          notes: {type: [string, 'null']}
                    coverage:
                      type: array
                      description: Optional exact per-distribution-day breakdown. Its totals must equal top-level items.
                      items:
                        type: object
                        required: [distribution_date, items]
                        additionalProperties: false
                        properties:
                          distribution_date: {type: string, format: date}
                          cooking_date: {type: [string, 'null'], format: date}
                          source_planning_snapshot_id: {type: [integer, 'null']}
                          items:
                            type: array
                            minItems: 1
                            items:
                              type: object
                              required: [item_name, po_qty]
                              additionalProperties: false
                              properties:
                                item_code: {type: [string, 'null']}
                                item_name: {type: string}
                                planning_snapshot_item_id: {type: [integer, 'null']}
                                planned_qty: {type: [number, 'null'], minimum: 0}
                                po_qty: {type: number, exclusiveMinimum: 0}
                                unit: {type: [string, 'null']}
                                planning_price: {type: [number, 'null'], minimum: 0}
                                po_price: {type: [number, 'null'], minimum: 0}
                                aliases:
                                  type: array
                                  items: {type: string}
                                notes: {type: [string, 'null']}
                  additionalProperties: true
      responses:
        '200':
          description: Staged proposal; never an executed action
          content:
            application/json:
              schema:
                type: object
                required: [proposalId, actionId, candidateStatus, actionStatus, inserted, approvalRequired, executed, executionLocked]
                properties:
                  proposalId:
                    type: integer
                  actionId:
                    type: integer
                  candidateStatus:
                    type: string
                  actionStatus:
                    type: string
                  inserted:
                    type: boolean
                  approvalRequired:
                    type: boolean
                  executed:
                    type: boolean
                  executionLocked:
                    type: boolean
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
