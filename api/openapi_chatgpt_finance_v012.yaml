openapi: 3.1.0
info:
  title: SPPG ChatGPT Finance Bridge
  version: 0.12.1
  description: Authenticated SPPG finance bridge with safe batched Firestore history backfill.
servers:
  - url: https://sppg-finance-gpt-site-production-5b7d.up.railway.app
security:
  - bearerAuth: []
paths:
  /v1/gpt/status:
    get:
      operationId: getSppgBridgeStatus
      summary: Check SPPG bridge configuration
      responses:
        '200':
          description: Bridge configuration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BridgeStatusResponse'
  /v1/gpt/finance-transactions:
    get:
      operationId: searchSppgFinanceTransactions
      summary: Search SPPG finance transactions in PostgreSQL
      parameters:
        - in: query
          name: site
          schema: {type: string, enum: [MAJA, CEMPLANG]}
        - in: query
          name: from
          schema: {type: string, format: date}
        - in: query
          name: to
          schema: {type: string, format: date}
        - in: query
          name: payment_status
          schema: {type: string, enum: [paid, unpaid, partial]}
        - in: query
          name: q
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      responses:
        '200':
          description: Matching transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchFinanceTransactionsResponse'
    post:
      operationId: createSppgFinanceTransactions
      summary: Create classified SPPG finance transactions
      description: Preserve explicit categories, never invent amounts, and reuse source_ref on retries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceTransactionBatch'
      responses:
        '200':
          description: Persisted and Firestore synchronization attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateFinanceTransactionsResponse'
  /v1/gpt/finance-transactions/{transaction_id}:
    patch:
      operationId: updateSppgFinanceTransaction
      summary: Correct an existing finance transaction or payment status
      parameters:
        - in: path
          name: transaction_id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinanceTransactionPatch'
      responses:
        '200':
          description: Updated and Firestore synchronization attempted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateFinanceTransactionResponse'
  /v1/gpt/backfill-firestore:
    post:
      operationId: backfillSppgFirestoreHistory
      summary: Preview or import one Firestore history batch into PostgreSQL
      description: Preview with dry_run=true. For import use dry_run=false and batch_size up to 200. If hasMore=true, call again using nextCursor as start_after_id. Firestore is read-only and existing records are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FirestoreBackfillRequest'
      responses:
        '200':
          description: One backfill batch result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FirestoreBackfillResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    BridgeStatusResponse:
      type: object
      properties:
        databaseReady: {type: boolean}
        googleCredentialsConfigured: {type: boolean}
        rawChatFolderConfigured: {type: boolean}
        firestoreProject: {type: string}
      required: [databaseReady, googleCredentialsConfigured, rawChatFolderConfigured, firestoreProject]
    FinanceTransactionBatch:
      type: object
      required: [site, source_ref, items]
      properties:
        site: {type: string, enum: [MAJA, CEMPLANG]}
        source_ref: {type: string}
        raw_text: {type: string}
        actor: {type: string, default: chatgpt}
        archive_raw_text: {type: boolean, default: true}
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/FinanceTransactionItem'
    FinanceTransactionItem:
      type: object
      required: [date, description, type, category, amount]
      properties:
        transaction_id: {type: [string, 'null']}
        date: {type: string, format: date}
        description: {type: string}
        type: {type: string, enum: [income, expense]}
        category: {type: string}
        amount: {type: number, minimum: 0}
        qty: {type: [number, 'null']}
        unit: {type: [string, 'null']}
        unit_price: {type: [number, 'null'], minimum: 0}
        order_by: {type: [string, 'null']}
        is_debt: {type: boolean, default: false}
        payment_status: {type: string, enum: [paid, unpaid, partial], default: paid}
        paid_amount: {type: [number, 'null'], minimum: 0}
        paid_date: {type: [string, 'null'], format: date}
        classification_confidence: {type: number, minimum: 0, maximum: 1, default: 1}
        classification_reason: {type: string}
        note: {type: string}
    FinanceTransactionPatch:
      type: object
      properties:
        date: {type: [string, 'null'], format: date}
        description: {type: [string, 'null']}
        category: {type: [string, 'null']}
        amount: {type: [number, 'null'], minimum: 0}
        qty: {type: [number, 'null']}
        unit: {type: [string, 'null']}
        unit_price: {type: [number, 'null'], minimum: 0}
        order_by: {type: [string, 'null']}
        is_debt: {type: [boolean, 'null']}
        payment_status: {type: [string, 'null'], enum: [paid, unpaid, partial, null]}
        paid_amount: {type: [number, 'null'], minimum: 0}
        paid_date: {type: [string, 'null'], format: date}
        category_override_reason: {type: [string, 'null']}
        note: {type: [string, 'null']}
        actor: {type: string, default: chatgpt}
    CreateFinanceTransactionsResponse:
      type: object
      properties:
        site: {type: string}
        sourceRef: {type: string}
        evidenceUri: {type: [string, 'null']}
        archiveError: {type: [string, 'null']}
        count: {type: integer}
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinanceTransactionSyncResult'
      required: [site, sourceRef, count, items]
    FinanceTransactionSyncResult:
      type: object
      properties:
        transactionId: {type: string}
        inserted: {type: boolean}
        firestoreSyncStatus: {type: string}
        firestoreDocument: {type: [string, 'null']}
        syncError: {type: [string, 'null']}
      required: [transactionId, inserted, firestoreSyncStatus]
    SearchFinanceTransactionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FinanceTransactionRecord'
      required: [items]
    FinanceTransactionRecord:
      type: object
      properties:
        transaction_id: {type: string}
        idempotency_key: {type: string}
        site: {type: string}
        transaction_date: {type: string, format: date}
        description: {type: string}
        transaction_type: {type: string}
        category: {type: string}
        amount: {type: number}
        qty: {type: [number, 'null']}
        unit: {type: [string, 'null']}
        unit_price: {type: [number, 'null']}
        order_by: {type: [string, 'null']}
        is_debt: {type: boolean}
        payment_status: {type: string}
        paid_amount: {type: number}
        paid_date: {type: [string, 'null'], format: date}
        source: {type: string}
        source_ref: {type: [string, 'null']}
        classification_confidence: {type: [number, 'null']}
        classification_reason: {type: [string, 'null']}
        note: {type: [string, 'null']}
        firestore_sync_status: {type: string}
        firestore_doc_id: {type: [string, 'null']}
        firestore_sync_error: {type: [string, 'null']}
        evidence_uri: {type: [string, 'null']}
        created_at: {type: string}
        updated_at: {type: string}
    UpdateFinanceTransactionResponse:
      type: object
      properties:
        transactionId: {type: string}
        changed: {type: boolean}
        firestoreSyncStatus: {type: string}
        firestoreDocument: {type: [string, 'null']}
        syncError: {type: [string, 'null']}
      required: [transactionId, changed]
    FirestoreBackfillRequest:
      type: object
      required: [site]
      properties:
        site: {type: string, enum: [MAJA, CEMPLANG]}
        dry_run:
          type: boolean
          default: true
          description: Preview only when true; import when false after explicit approval.
        batch_size:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
          description: Firestore documents processed in this call.
        start_after_id:
          type: [string, 'null']
          description: Use nextCursor from the previous batch; omit for the first batch.
        actor: {type: string, default: chatgpt}
    FirestoreBackfillSample:
      type: object
      properties:
        firestoreId: {type: string}
        date: {type: string, format: date}
        description: {type: string}
        category: {type: string}
        amount: {type: number}
    FirestoreBackfillError:
      type: object
      properties:
        firestoreId: {type: string}
        reason: {type: string}
    FirestoreBackfillResponse:
      type: object
      properties:
        site: {type: string}
        dryRun: {type: boolean}
        batchSize: {type: integer}
        startAfterId: {type: [string, 'null']}
        firestoreRead: {type: integer}
        importable: {type: integer}
        alreadyPresent: {type: integer}
        inserted: {type: integer}
        invalid: {type: integer}
        failed: {type: integer}
        hasMore: {type: boolean}
        nextCursor: {type: [string, 'null']}
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FirestoreBackfillError'
        sample:
          type: array
          items:
            $ref: '#/components/schemas/FirestoreBackfillSample'
      required: [site, dryRun, batchSize, firestoreRead, importable, alreadyPresent, inserted, invalid, failed, hasMore, errors, sample]
