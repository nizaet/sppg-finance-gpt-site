openapi: 3.1.0
info:
  title: SPPG Operations Extension
  version: 0.14.0
  description: Vendor payables and operational inventory. Inventory movements do not create finance transactions.
servers:
  - url: https://sppg-finance-gpt-site-production-5b7d.up.railway.app
security:
  - bearerAuth: []
paths:
  /v1/vendor-payables/from-receipt:
    post:
      operationId: processSppgVendorPayableFromReceipt
      summary: Preview or commit a vendor payable from a confirmed goods receipt
      description: Always preview with commit=false first. vendor_cost_price must be explicit and must never be inferred from planning_price or po_price.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VendorPayableRequest'}
      responses:
        '200':
          description: Payable preview or committed payable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VendorPayableResponse'}
        '409': {description: Cost line is ambiguous}
  /v1/vendor-payables:
    get:
      operationId: searchSppgVendorPayables
      summary: Search vendor payables
      parameters:
        - {in: query, name: site, schema: {type: string, enum: [MAJA, CEMPLANG]}}
        - {in: query, name: vendor, schema: {type: string}}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        '200':
          description: Matching payables
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PayableSearchResponse'}
  /v1/inventory/from-receipt:
    post:
      operationId: postSppgReceiptToInventory
      summary: Preview or post a confirmed goods receipt into operational stock
      description: Idempotent. This creates stock movements only and never finance transactions.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReceiptToStockRequest'}
      responses:
        '200':
          description: Inventory receipt result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReceiptToStockResponse'}
  /v1/inventory/usage:
    post:
      operationId: processSppgInventoryUsage
      summary: Preview or record actual kitchen stock usage
      description: Use commit=false first. Usage reduces operational stock only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InventoryUsageRequest'}
      responses:
        '200':
          description: Usage preview or commit result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryUsageResponse'}
  /v1/inventory/balance:
    get:
      operationId: getSppgInventoryBalance
      summary: Read current operational stock balance for one item
      parameters:
        - {in: query, name: site, required: true, schema: {type: string, enum: [MAJA, CEMPLANG]}}
        - {in: query, name: item, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryBalanceResponse'}
  /v1/inventory/requirement-preview:
    get:
      operationId: previewSppgInventoryRequirement
      summary: Calculate purchase quantity after using available stock
      description: Useful for chicken ordered for two days. purchaseNeeded = max(plannedQty - available stock, 0).
      parameters:
        - {in: query, name: site, required: true, schema: {type: string, enum: [MAJA, CEMPLANG]}}
        - {in: query, name: item, required: true, schema: {type: string}}
        - {in: query, name: plannedQty, required: true, schema: {type: number, minimum: 0}}
        - {in: query, name: unit, schema: {type: string, default: kg}}
      responses:
        '200':
          description: Requirement preview
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InventoryRequirementResponse'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    VendorCostLine:
      type: object
      required: [vendor_cost_price]
      properties:
        goods_receipt_item_id: {type: [integer, 'null']}
        item_name: {type: [string, 'null']}
        vendor_cost_price: {type: number, minimum: 0}
    VendorPayableRequest:
      type: object
      required: [site, purchase_order_id, goods_receipt_id, commit, lines]
      properties:
        site: {type: string, enum: [MAJA, CEMPLANG]}
        purchase_order_id: {type: integer}
        goods_receipt_id: {type: integer}
        invoice_number: {type: [string, 'null']}
        invoice_date: {type: [string, 'null'], format: date}
        due_date: {type: [string, 'null'], format: date}
        evidence_uri: {type: [string, 'null']}
        commit: {type: boolean, default: false}
        lines:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/VendorCostLine'}
    VendorPayableLine:
      type: object
      properties:
        goods_receipt_item_id: {type: integer}
        purchase_order_item_id: {type: [integer, 'null']}
        item_name: {type: string}
        accepted_qty: {type: number}
        unit: {type: [string, 'null']}
        planned_qty: {type: [number, 'null']}
        po_qty: {type: [number, 'null']}
        planning_price: {type: [number, 'null']}
        po_price: {type: [number, 'null']}
        vendor_cost_price: {type: number}
        line_total: {type: number}
    VendorPayableResponse:
      type: object
      properties:
        committed: {type: boolean}
        canCommit: {type: boolean}
        duplicate: {type: boolean}
        vendorInvoiceId: {type: [integer, 'null']}
        site: {type: string}
        purchaseOrderId: {type: integer}
        poCode: {type: string}
        goodsReceiptId: {type: integer}
        vendorCode: {type: string}
        payableStatus: {type: string}
        grossAmount: {type: number}
        netAmount: {type: number}
        financeTransactionCreated: {type: boolean}
        lines:
          type: array
          items: {$ref: '#/components/schemas/VendorPayableLine'}
    PayableRecord:
      type: object
      properties:
        vendor_invoice_id: {type: integer}
        vendor_code: {type: string}
        site: {type: string}
        purchase_order_id: {type: [integer, 'null']}
        goods_receipt_id: {type: [integer, 'null']}
        invoice_number: {type: [string, 'null']}
        gross_amount: {type: number}
        net_amount: {type: number}
        payable_status: {type: string}
    PayableSearchResponse:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/PayableRecord'}
    ReceiptToStockRequest:
      type: object
      required: [site, goods_receipt_id, commit]
      properties:
        site: {type: string, enum: [MAJA, CEMPLANG]}
        goods_receipt_id: {type: integer}
        commit: {type: boolean, default: false}
    StockMovementPreview:
      type: object
      properties:
        sourceKey: {type: string}
        itemName: {type: string}
        qty: {type: number}
        unit: {type: [string, 'null']}
        fromLocation: {type: string}
        toLocation: {type: string}
    ReceiptToStockResponse:
      type: object
      properties:
        committed: {type: boolean}
        canCommit: {type: boolean}
        goodsReceiptId: {type: integer}
        inserted: {type: integer}
        duplicates: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/StockMovementPreview'}
    InventoryUsageRequest:
      type: object
      required: [site, item_name, qty, unit, commit]
      properties:
        site: {type: string, enum: [MAJA, CEMPLANG]}
        item_name: {type: string}
        qty: {type: number, exclusiveMinimum: 0}
        unit: {type: string}
        occurred_at: {type: [string, 'null'], format: date-time}
        source_ref: {type: [string, 'null']}
        commit: {type: boolean, default: false}
    InventoryUsageResponse:
      type: object
      properties:
        committed: {type: boolean}
        duplicate: {type: boolean}
        movementId: {type: [integer, 'null']}
        site: {type: string}
        itemName: {type: string}
        balanceBefore: {type: number}
        usageQty: {type: number}
        balanceAfter: {type: number}
        unit: {type: string}
        stockWarning: {type: boolean}
    InventoryBalanceResponse:
      type: object
      properties:
        site: {type: string}
        itemName: {type: string}
        balance: {type: number}
    InventoryRequirementResponse:
      type: object
      properties:
        site: {type: string}
        itemName: {type: string}
        plannedQty: {type: number}
        stockAvailable: {type: number}
        purchaseNeeded: {type: number}
        unit: {type: string}
        financeTransactionCreated: {type: boolean}
