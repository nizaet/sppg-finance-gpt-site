openapi: 3.1.0
info:
  title: SPPG Vendor Payables Bridge
  version: 0.13.0
  description: Preview and commit vendor payables from confirmed goods receipts without creating finance transactions automatically.
servers:
  - url: https://sppg-finance-gpt-site-production-5b7d.up.railway.app
security:
  - bearerAuth: []
paths:
  /v1/vendor-payables/from-receipt:
    post:
      operationId: processSppgVendorPayableFromReceipt
      summary: Preview or commit a vendor payable from a confirmed goods receipt
      description: Always preview with commit=false first. vendor_cost_price must be supplied explicitly. Never infer it from planning_price or po_price. This operation does not create a finance ledger transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorPayableRequest'
      responses:
        '200':
          description: Payable preview or committed payable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorPayableResponse'
        '409':
          description: A cost line cannot be resolved safely to exactly one receipt item
  /v1/vendor-payables:
    get:
      operationId: searchSppgVendorPayables
      summary: Search vendor payables
      parameters:
        - in: query
          name: site
          schema: {type: string, enum: [MAJA, CEMPLANG]}
        - in: query
          name: vendor
          schema: {type: string}
        - in: query
          name: status
          schema: {type: string, enum: [UNPAID, PARTIAL, PAID, CANCELLED]}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 500, default: 200}
      responses:
        '200':
          description: Matching vendor payables
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorPayableSearchResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    VendorCostLine:
      type: object
      required: [vendor_cost_price]
      properties:
        goods_receipt_item_id: {type: [integer, 'null']}
        item_name: {type: [string, 'null']}
        vendor_cost_price: {type: number, minimum: 0}
    VendorPayableRequest:
      type: object
      required: [site, purchase_order_id, goods_receipt_id, commit, lines]
      properties:
        site: {type: string, enum: [MAJA, CEMPLANG]}
        purchase_order_id: {type: integer}
        goods_receipt_id: {type: integer}
        invoice_number: {type: [string, 'null']}
        invoice_date: {type: [string, 'null'], format: date}
        due_date: {type: [string, 'null'], format: date}
        evidence_uri: {type: [string, 'null']}
        commit:
          type: boolean
          default: false
          description: false previews only; true commits a vendor payable after explicit confirmation.
        lines:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VendorCostLine'
    VendorPayableLine:
      type: object
      properties:
        goods_receipt_item_id: {type: integer}
        purchase_order_item_id: {type: [integer, 'null']}
        item_code: {type: [string, 'null']}
        item_name: {type: string}
        accepted_qty: {type: number}
        unit: {type: [string, 'null']}
        planned_qty: {type: [number, 'null']}
        po_qty: {type: [number, 'null']}
        planning_price: {type: [number, 'null']}
        po_price: {type: [number, 'null']}
        vendor_cost_price: {type: number}
        line_total: {type: number}
    VendorPayableResponse:
      type: object
      properties:
        committed: {type: boolean}
        canCommit: {type: boolean}
        duplicate: {type: boolean}
        vendorInvoiceId: {type: integer}
        site: {type: string}
        purchaseOrderId: {type: integer}
        poCode: {type: string}
        goodsReceiptId: {type: integer}
        vendorCode: {type: string}
        invoiceNumber: {type: [string, 'null']}
        invoiceDate: {type: [string, 'null'], format: date}
        dueDate: {type: [string, 'null'], format: date}
        payableStatus: {type: string}
        grossAmount: {type: number}
        netAmount: {type: number}
        financeTransactionCreated: {type: boolean}
        lines:
          type: array
          items:
            $ref: '#/components/schemas/VendorPayableLine'
    VendorPayableRecord:
      type: object
      properties:
        vendor_invoice_id: {type: integer}
        vendor_code: {type: string}
        site: {type: string}
        purchase_order_id: {type: [integer, 'null']}
        goods_receipt_id: {type: [integer, 'null']}
        invoice_number: {type: [string, 'null']}
        invoice_date: {type: [string, 'null'], format: date}
        gross_amount: {type: number}
        net_amount: {type: number}
        payable_status: {type: string}
        due_date: {type: [string, 'null'], format: date}
        po_code: {type: [string, 'null']}
        distribution_date: {type: [string, 'null'], format: date}
    VendorPayableSearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VendorPayableRecord'
