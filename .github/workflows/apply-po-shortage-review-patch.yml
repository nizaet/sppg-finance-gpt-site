name: Apply PO shortage review patch

on:
  push:
    branches:
      - fix/po-reminder-shortage-review-stock-confirm-20260817

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/po-reminder-shortage-review-stock-confirm-20260817
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python tools/patch_po_shortage_review_20260817.py
      - name: Commit generated application changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/po_reminder_tools_api.py src/operations/apiClient.js src/operations/OperationsPoPlanner.jsx
          git diff --cached --check
          git commit -m "Apply PO shortage review UI and override semantics"
          git push origin HEAD:fix/po-reminder-shortage-review-stock-confirm-20260817
