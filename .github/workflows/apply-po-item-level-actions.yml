name: Apply PO item-level action patch

on:
  push:
    branches:
      - fix/po-item-level-ordering-actions-20260817

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/po-item-level-ordering-actions-20260817
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact patch
        run: python tools/patch_po_item_level_actions_20260817.py
      - name: Validate generated diff
        run: |
          python -m py_compile backend/po_reminder_v4_api.py backend/po_reminder_completed_shortage.py
          git diff --check
          grep -q 'BELUM DIPESAN' src/operations/OperationsPoPlanner.jsx
          grep -q 'Buat PO Tambahan' src/operations/OperationsPoPlanner.jsx
          grep -q 'completed_po_qty' backend/po_reminder_v4_api.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/po_reminder_v4_api.py backend/po_reminder_completed_shortage.py src/operations/OperationsPoPlanner.jsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Fix PO reminders with exact item-level ordering actions"
          git push origin HEAD:fix/po-item-level-ordering-actions-20260817
