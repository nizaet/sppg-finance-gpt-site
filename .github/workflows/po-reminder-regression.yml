name: PO Reminder Regression

on:
  pull_request:
  push:
    branches:
      - llm-wiki-v0
      - fix/po-reminder-coverage-tempe-v2
      - fix/po-reminder-completed-shortage-20260816
      - fix/po-reminder-wikian-tempe-sync-20260816
      - feat/po-ux-split-override-colors-20260817
      - fix/control-tower-receiving-vendor-sync-20260817

jobs:
  po-reminder-regression:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sppg_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sppg_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sppg_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - name: Run strict PO reminder tests
        run: |
          python -m unittest -v tests.test_po_reminder_v4
          python -m unittest -v tests.test_po_reminder_completed_shortage
          python -m unittest -v tests.test_po_reminder_operational_reconcile
          python -m unittest -v tests.test_po_reminder_tools
          python -m unittest -v tests.test_item_taxonomy_vendor_sync
          python -m unittest -v tests.test_control_tower_po_sync
      - name: Compile reminder and planning bridge modules
        run: python -m py_compile backend/po_reminder_v3_api.py backend/po_reminder_v4_api.py backend/po_reminder_completed_shortage.py backend/po_reminder_operational_reconcile.py backend/po_reminder_tools_api.py backend/item_taxonomy.py backend/control_tower_api.py backend/calculator_planning_bridge_api.py backend/calculator_pages.py backend/migrate.py
      - name: Validate migration and dedicated Tempe rules
        run: |
          python -m backend.migrate
          python - <<'PY'
          from backend.db import connection

          with connection() as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    select site_code, category_code, lead_time_days_before_cooking
                    from vendor_rules
                    where vendor_code='KOPERASI'
                      and effective_from=date '2026-08-16'
                      and category_code in ('TEMPE','TAHU')
                    order by site_code, category_code
                  """)
                  rules = {
                      (row['site_code'], row['category_code']): row['lead_time_days_before_cooking']
                      for row in cur.fetchall()
                  }
                  cur.execute("select to_regclass('public.po_reminder_overrides') as table_name")
                  override_table = cur.fetchone()['table_name']
          assert rules[('MAJA','TEMPE')] == 4, rules
          assert rules[('MAJA','TAHU')] == 2, rules
          assert rules[('CEMPLANG','TEMPE')] is None, rules
          assert override_table == 'po_reminder_overrides', override_table
          print('procurement migration rules ok:', rules)
          print('override table ok:', override_table)
          PY
      - name: Validate split same-vendor order support
        run: python -m unittest -v tests.test_po_split_integration
      - name: Assert stable frontend endpoints
        run: |
          grep -q '/v1/po-reminders-v3?' src/operations/apiClient.js
          grep -q '/v1/po-reminders/override' src/operations/apiClient.js
          grep -q '/v1/purchase-orders/split' src/operations/apiClient.js
