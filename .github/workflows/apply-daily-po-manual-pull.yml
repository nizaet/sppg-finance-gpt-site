name: Apply daily PO manual pull patch

on:
  push:
    branches:
      - fix/po-item-level-ordering-actions-20260817

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/po-item-level-ordering-actions-20260817
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply manual daily pull patch
        run: python tools/patch_daily_po_manual_pull_20260817.py
      - name: Validate generated diff
        run: |
          git diff --check
          grep -q 'const \[dailyPulled, setDailyPulled\]' src/operations/OperationsPoPlanner.jsx
          grep -q 'const pullDailyData = async' src/operations/OperationsPoPlanner.jsx
          grep -q 'Bersihkan Semua' src/operations/OperationsPoPlanner.jsx
          grep -q 'Bersihkan Vendor' src/operations/OperationsPoPlanner.jsx
          if grep -q 'useEffect(() => { load(); }, \[distributionDate, cookingDate, activeSite\])' src/operations/OperationsPoPlanner.jsx; then exit 1; fi
      - name: Commit generated UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/operations/OperationsPoPlanner.jsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Make daily PO planning pull explicit and clearable"
          git push origin HEAD:fix/po-item-level-ordering-actions-20260817
